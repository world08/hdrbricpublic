name: privacy cleanup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite public history when needed
        id: rewrite
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if git log --format='%ae%n%ce' | grep -Ev '@users\.noreply\.github\.com$' | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            tree="$(git write-tree)"
            root="$(printf '%s\n' 'chore: reset public history' | git commit-tree "$tree")"
            git push --force origin "$root:refs/heads/main"
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/workflows/privacy-history-cleanup.yml/dispatches" \
              -d '{"ref":"main"}'
            echo "rewritten=true" >> "$GITHUB_OUTPUT"
          else
            echo "rewritten=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove prior runs
        if: steps.rewrite.outputs.rewritten == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPO"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          mapfile -t ids < <(curl --fail --silent --show-error "${auth[@]}" "$api/actions/runs?per_page=100" | jq -r --argjson current "$CURRENT_RUN" '.workflow_runs[] | select(.id != $current) | .id')

          for id in "${ids[@]}"; do
            status="$(curl --fail --silent --show-error "${auth[@]}" "$api/actions/runs/$id" | jq -r '.status')"
            case "$status" in
              queued|in_progress|waiting|requested|pending)
                curl --silent --show-error -X POST "${auth[@]}" "$api/actions/runs/$id/cancel" >/dev/null || true
                ;;
            esac
          done

          for _ in $(seq 1 60); do
            active=0
            for id in "${ids[@]}"; do
              status="$(curl --silent --show-error "${auth[@]}" "$api/actions/runs/$id" | jq -r '.status // "missing"' 2>/dev/null || echo missing)"
              case "$status" in
                queued|in_progress|waiting|requested|pending) active=1 ;;
              esac
            done
            [ "$active" -eq 0 ] && break
            sleep 5
          done

          for id in "${ids[@]}"; do
            curl --silent --show-error -X DELETE "${auth[@]}" "$api/actions/runs/$id" >/dev/null || true
          done
          echo "prior-runs-removed"

      - name: Remove cleanup workflow and dispatch audit
        if: steps.rewrite.outputs.rewritten == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/privacy-history-cleanup.yml
          git commit -m "chore: remove temporary cleanup"
          git push origin HEAD:main

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/raw-duplicate-gate.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "audit-dispatched"
